<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="책을 관리하고 독서 기록을 남기며 AI에게 다음 책을 추천받는 개인 독서 웹서비스">
    <title>책장 | BOOKSHELF</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="#top" aria-label="책장 홈">📚 <span>책장</span></a>
            <nav aria-label="주요 메뉴">
                <a href="#books">나의 책</a>
                <a href="#recommend">AI 책 추천</a>
                <a href="#records">독서 기록</a>
            </nav>
        </div>
    </header>

    <main id="top" class="container">
        <section class="hero">
            <p class="eyebrow">MY READING SPACE</p>
            <h1>읽고, 기록하고,<br>다음 책을 발견하는 공간</h1>
            <p>읽고 싶은 책을 정리하고 독서의 순간을 남겨보세요. 다음 책이 고민될 때는 AI가 한 권을 추천해 드립니다.</p>
        </section>

        <section id="books" class="section-card">
            <div class="section-heading">
                <div><span class="section-number">01</span><h2>나의 책</h2></div>
                <p>책을 추가하고 읽기 상태를 관리해보세요.</p>
            </div>

            <div class="book-form">
                <label class="sr-only" for="book-title">책 제목</label>
                <input type="text" id="book-title" placeholder="책 제목을 입력하세요" maxlength="100">
                <label class="sr-only" for="book-status">독서 상태</label>
                <select id="book-status">
                    <option value="want">읽고 싶은 책</option>
                    <option value="reading">읽는 중</option>
                    <option value="finished">읽은 책</option>
                </select>
                <button id="add-book" type="button">+ 책 추가</button>
            </div>

            <div class="book-list">
                <div class="book-card" id="want-books"><h3>🔖 읽고 싶은 책</h3><div class="book-items"></div></div>
                <div class="book-card" id="reading-books"><h3>📖 읽는 중</h3><div class="book-items"></div></div>
                <div class="book-card" id="finished-books"><h3>✅ 읽은 책</h3><div class="book-items"></div></div>
            </div>
        </section>

        <section id="recommend" class="section-card recommend-section">
            <div class="section-heading">
                <div><span class="section-number">02</span><h2>AI 책 추천</h2></div>
                <p>지금의 마음과 관심사를 자유롭게 적어주세요.</p>
            </div>
            <div class="recommend-form">
                <label for="recommend-input">어떤 책을 읽고 싶나요?</label>
                <textarea id="recommend-input" maxlength="500" placeholder="예: 요즘 진로를 고민하고 있어요. 너무 무겁지 않으면서 생각할 거리를 주는 한국 소설을 읽고 싶어요."></textarea>
                <button id="recommend-button" type="button">AI에게 한 권 추천받기</button>
            </div>
            <div id="recommend-result" aria-live="polite"></div>
        </section>

        <section id="records" class="section-card">
            <div class="section-heading">
                <div><span class="section-number">03</span><h2>독서 기록</h2></div>
                <p>책을 읽고 남은 생각을 짧게 기록해보세요.</p>
            </div>
            <div class="record-form">
                <div class="form-row">
                    <label for="record-title">책 제목</label>
                    <input id="record-title" type="text" maxlength="100" placeholder="책 제목">
                </div>
                <div class="form-row">
                    <label for="record-rating">별점</label>
                    <select id="record-rating">
                        <option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option>
                    </select>
                </div>
                <div class="form-row full"><label for="record-review">한줄평</label><input id="record-review" type="text" maxlength="150" placeholder="이 책을 한 문장으로 남긴다면?"></div>
                <div class="form-row full"><label for="record-quote">기억하고 싶은 문장</label><textarea id="record-quote" maxlength="300" placeholder="기억하고 싶은 문장을 적어보세요."></textarea></div>
                <div class="form-row full"><label for="record-thought">나에게 남은 것</label><textarea id="record-thought" maxlength="500" placeholder="책을 읽고 든 생각이나 달라진 점을 적어보세요."></textarea></div>
                <button id="save-record" type="button">기록 저장하기</button>
            </div>
            <p id="record-message" class="form-message" aria-live="polite"></p>
            <div id="record-list" class="record-list"></div>
        </section>
    </main>

    <footer><p>BOOKSHELF · 나만의 독서 공간</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
